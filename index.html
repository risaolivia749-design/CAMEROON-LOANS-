<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MTN Loans Cameroon - Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .header {
      background: #ffcc00;
      padding: 22px 15px;
      text-align: center;
      border-bottom: 4px solid #222;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: bold;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    .notice {
      background: #fff4c2;
      border-left: 5px solid #ffcc00;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 13px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #ffcc00;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e6b800;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 7px;
      font-weight: bold;
      line-height: 1.5;
    }

    .success {
      background: #d9f7df;
      color: #176b2c;
    }

    .error {
      background: #ffdede;
      color: #9b1c1c;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin: 20px 0;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>MTN Loans Cameroon</h1>
    <p>Educational Loan Application Prototype</p>
  </div>

  <div class="container">

    <div class="card">

      <div class="notice">
        <strong>Demo Notice:</strong>
        This is an educational prototype. Please do not enter real
        personal, financial, or identification information.
      </div>

      <h2>Loan Application</h2>

      <form id="loanForm">

        <label for="full_name">Full Name</label>
        <input
          type="text"
          id="full_name"
          placeholder="Example: Demo Applicant"
          required
        >

        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="Example: 690000000"
          required
        >

        <label for="loan_amount">Loan Amount (FCFA)</label>
        <input
          type="number"
          id="loan_amount"
          min="5000"
          max="500000"
          placeholder="5000 - 500000"
          required
        >

        <label for="repayment_period">Repayment Period</label>
        <select id="repayment_period" required>
          <option value="">Select period</option>
          <option value="1">1 Month</option>
          <option value="2">2 Months</option>
          <option value="3">3 Months</option>
          <option value="4">4 Months</option>
          <option value="5">5 Months</option>
          <option value="6">6 Months</option>
        </select>

        <label for="loan_purpose">Loan Purpose</label>
        <textarea
          id="loan_purpose"
          placeholder="Example: Educational demo"
          required
        ></textarea>

        <button type="submit" id="submitButton">
          Submit Application
        </button>

      </form>

      <div id="message"></div>

    </div>

    <div class="footer">
      MTN Loans Cameroon — Educational Prototype
    </div>

  </div>

  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    // YOUR SUPABASE PROJECT
    const SUPABASE_URL =
      "https://onsrpuqiffzxhrjwagrz.supabase.co";

    // IMPORTANT:
    // Paste your Supabase PUBLISHABLE key between the quotation marks below.
    // Do NOT use a secret/service-role key here.
    const SUPABASE_KEY =
      "sb_publishable_X0YDa_Rknxmp3RVav9JHvg_DTh8qeOX";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form = document.getElementById("loanForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");


    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
      message.style.display = "block";
    }


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.style.display = "none";

      const fullName =
        document.getElementById("full_name").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const loanAmount =
        Number(document.getElementById("loan_amount").value);

      const repaymentPeriod =
        Number(document.getElementById("repayment_period").value);

      const loanPurpose =
        document.getElementById("loan_purpose").value.trim();


      if (!fullName || !phone || !loanAmount ||
          !repaymentPeriod || !loanPurpose) {

        showMessage(
          "Please complete all fields.",
          "error"
        );

        return;
      }


      if (loanAmount < 5000 || loanAmount > 500000) {

        showMessage(
          "Loan amount must be between 5,000 and 500,000 FCFA.",
          "error"
        );

        return;
      }


      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";


      try {

        const { data, error } =
          await supabaseClient
            .from("loan_applications")
            .insert([
              {
                full_name: fullName,
                phone: phone,
                loan_amount: loanAmount,
                repayment_period: repaymentPeriod,
                loan_purpose: loanPurpose,
                status: "pending"
              }
            ])
            .select();


        if (error) {

          console.error("Supabase error:", error);

          showMessage(
            "Submission failed: " + error.message,
            "error"
          );

          return;
        }


        console.log("Application saved:", data);


        showMessage(
          "Application submitted successfully. Status: Pending.",
          "success"
        );


        form.reset();


      } catch (error) {

        console.error("Unexpected error:", error);

        showMessage(
          "Something went wrong. Please check your Supabase configuration.",
          "error"
        );

      } finally {

        submitButton.disabled = false;
        submitButton.textContent = "Submit Application";

      }

    });

  </script>

</body>
</html>
