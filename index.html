<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MTN Loans Cameroon</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 25px;
      color: #555;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 7px;
      box-sizing: border-box;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      display: none;
      text-align: center;
    }

    .success {
      background: #e8f7e8;
      color: #176b17;
    }

    .error {
      background: #ffe7e7;
      color: #a40000;
    }

    .notice {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>MTN Loans Cameroon</h1>
  <p class="subtitle">Loan Application Form</p>

  <form id="loanForm">

    <label for="fullName">Full Name</label>
    <input
      type="text"
      id="fullName"
      required
      placeholder="Enter your full name"
    >

    <label for="phone">Phone Number</label>
    <input
      type="tel"
      id="phone"
      required
      placeholder="Example: 6XXXXXXXX"
    >

    <label for="loanAmount">Loan Amount</label>
    <input
      type="number"
      id="loanAmount"
      min="5000"
      max="500000"
      required
      placeholder="5000 - 500000 FCFA"
    >

    <label for="repaymentPeriod">Repayment Period</label>
    <select id="repaymentPeriod" required>
      <option value="">Choose repayment period</option>
      <option value="1">1 Month</option>
      <option value="2">2 Months</option>
      <option value="3">3 Months</option>
      <option value="4">4 Months</option>
      <option value="5">5 Months</option>
      <option value="6">6 Months</option>
    </select>

    <label for="loanPurpose">Purpose of Loan</label>
    <textarea
      id="loanPurpose"
      required
      placeholder="Briefly explain why you need the loan"
    ></textarea>

    <button type="submit" id="submitButton">
      Submit Application
    </button>

  </form>

  <div id="message"></div>

  <p class="notice">
    Applications are reviewed manually before approval.
  </p>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  // ==============================
  // ADD YOUR SUPABASE DETAILS HERE
  // ==============================

  const SUPABASE_URL = https://onsrpuqiffzxhrjwagrz.supabase.co/rest/v1/;

  const SUPABASE_KEY = sb_publishable_X0YDa_Rknxmp3RVav9JHvg_DTh8qeOX;


  const { createClient } = window.supabase;

  const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  const form = document.getElementById("loanForm");

  const messageBox = document.getElementById("message");

  const submitButton =
    document.getElementById("submitButton");


  form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const fullName =
      document.getElementById("fullName").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const loanAmount =
      Number(document.getElementById("loanAmount").value);

    const repaymentPeriod =
      Number(document.getElementById("repaymentPeriod").value);

    const loanPurpose =
      document.getElementById("loanPurpose").value.trim();


    if (loanAmount < 5000 || loanAmount > 500000) {

      showMessage(
        "Loan amount must be between 5,000 and 500,000 FCFA.",
        "error"
      );

      return;
    }


    submitButton.disabled = true;

    submitButton.textContent = "Submitting...";


    const { error } = await supabaseClient
      .from("loan_applications")
      .insert([
        {
          full_name: fullName,
          phone: phone,
          loan_amount: loanAmount,
          repayment_period: repaymentPeriod,
          loan_purpose: loanPurpose,
          status: "pending"
        }
      ]);


    if (error) {

      console.error(error);

      showMessage(
        "Application could not be submitted. Please try again.",
        "error"
      );

    } else {

      showMessage(
        "Application submitted successfully. It is now pending review.",
        "success"
      );

      form.reset();
    }


    submitButton.disabled = false;

    submitButton.textContent = "Submit Application";

  });


  function showMessage(text, type) {

    messageBox.textContent = text;

    messageBox.className = type;

    messageBox.style.display = "block";

  }

</script>

</body>
</html>
